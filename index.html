<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flygram — the social network for insects</title>
<meta name="description" content="Flygram is a social network for insects. Scroll the feed, discover profiles, follow bugs and share the buzz.">
<style>
:root{--ig1:#7b2ff7;--ig2:#f72585;--ig3:#ff7a18;--ink:#17151b;--muted:#756f7e;--line:#ebe7ef;--surface:#fff;--soft:#faf8fc;--shadow:0 18px 50px rgba(45,20,70,.08);--green:#65c466;--radius:22px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff 0,#fbf9fc 55%,#fff 100%)}button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.gradient-text{background:linear-gradient(90deg,var(--ig1),var(--ig2),var(--ig3));-webkit-background-clip:text;background-clip:text;color:transparent}.app{display:grid;grid-template-columns:250px minmax(0,760px) 310px;gap:26px;max-width:1450px;margin:0 auto;padding:0 24px}.sidebar{height:100vh;position:sticky;top:0;padding:28px 12px 24px 0;display:flex;flex-direction:column}.brand{font-size:28px;font-weight:900;letter-spacing:-1.5px;margin:0 0 34px 14px}.brand small{font-size:9px;display:block;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{border:0;background:transparent;text-align:left;padding:13px 16px;border-radius:15px;display:flex;align-items:center;gap:14px;color:#4e4758;font-weight:650}.nav button:hover,.nav button.active{background:#f3edf9;color:var(--ink)}.nav .ico{width:22px;text-align:center;font-size:21px}.sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px}.profile-mini{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);border-radius:17px;background:var(--surface)}.mini-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:24px;color:#fff;background:linear-gradient(135deg,var(--ig1),var(--ig2),var(--ig3));box-shadow:0 0 0 3px #fff,0 0 0 5px rgba(247,37,133,.28)}.main{padding:22px 0 100px}.topbar{display:none}.stories{display:flex;gap:16px;overflow:auto;padding:8px 3px 20px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.story{flex:0 0 70px;text-align:center;font-size:11px;color:#4b4654}.story-btn{border:0;background:transparent;padding:0}.story-ring{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--ig1),var(--ig2),var(--ig3));margin:auto auto 5px}.story-inner{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid #fff;font-size:30px}.feed{display:flex;flex-direction:column;gap:22px}.post{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 3px 12px rgba(30,20,40,.025)}.post-head{display:flex;align-items:center;gap:11px;padding:14px 15px}.post-user{display:flex;align-items:center;gap:10px;min-width:0}.post-user strong{font-size:14px}.post-meta{font-size:12px;color:var(--muted)}.verified{font-size:12px;color:#5f7df5}.more{margin-left:auto;background:none;border:0;font-size:22px}.post-media{aspect-ratio:1.08/1;display:grid;place-items:center;position:relative;overflow:hidden}.scene-a{background:radial-gradient(circle at 28% 25%,#ffd67f 0 13%,transparent 14%),linear-gradient(135deg,#6f2ff2 0%,#e9358f 55%,#ff8b1f)}.scene-b{background:radial-gradient(circle at 73% 23%,#c6f08e 0 13%,transparent 14%),linear-gradient(135deg,#4c1d95 0%,#e45a96 45%,#ffa36a 100%)}.scene-c{background:radial-gradient(circle at 45% 30%,#ffe9a6 0 18%,transparent 19%),linear-gradient(145deg,#e98c0c,#f04475 46%,#5c2bd8)}.scene-d{background:radial-gradient(circle at 70% 70%,#f6c2e6 0 10%,transparent 11%),linear-gradient(135deg,#0e7490,#22c55e 45%,#f59e0b)}.insect{font-size:130px;filter:drop-shadow(0 18px 22px rgba(0,0,0,.22));transform:translateY(-2px)}.post-media::after{content:"";position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(transparent,rgba(0,0,0,.2));pointer-events:none}.post-body{padding:12px 15px 17px}.actions{display:flex;align-items:center;gap:16px}.actions button{border:0;background:none;padding:0;font-size:23px}.actions .save{margin-left:auto}.liked{color:#ff2f67}.post-likes{font-size:13px;font-weight:800;margin-top:10px}.caption{font-size:14px;line-height:1.5;margin-top:7px}.caption b{margin-right:5px}.comments{font-size:13px;color:var(--muted);margin-top:8px}.rightbar{padding-top:93px}.right-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.right-title h3{font-size:14px;color:var(--muted);margin:0}.right-title button{border:0;background:transparent;font-size:12px;font-weight:800}.suggestions{display:flex;flex-direction:column;gap:14px}.suggestion{display:flex;align-items:center;gap:10px}.suggestion .spacer{flex:1}.follow-btn{border:0;background:linear-gradient(90deg,var(--ig1),var(--ig2),var(--ig3));color:#fff;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800}.searchbox{display:flex;align-items:center;gap:8px;background:#f3f0f6;border-radius:13px;padding:11px 13px;margin-bottom:22px}.searchbox input{border:0;outline:0;background:transparent;width:100%;font-size:13px}.view{display:none}.view.active{display:block}.page-title{font-size:28px;letter-spacing:-.8px;margin:3px 0 18px}.explore-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.tile{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;overflow:hidden;color:white;position:relative}.tile .insect{font-size:72px}.tile:hover .tile-overlay{opacity:1}.tile-overlay{opacity:0;position:absolute;inset:0;background:rgba(0,0,0,.36);display:flex;align-items:flex-end;justify-content:space-between;padding:12px;color:#fff;font-size:13px;font-weight:800;transition:.2s}.profile-page{max-width:720px;margin:auto}.profile-header{display:flex;gap:30px;align-items:center;padding:8px 0 28px;border-bottom:1px solid var(--line)}.profile-large{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:65px;background:linear-gradient(135deg,var(--ig1),var(--ig2),var(--ig3));box-shadow:0 0 0 6px #fff,0 0 0 8px #ecd9f8}.profile-main h2{margin:0 0 4px;font-size:24px}.profile-main p{margin:8px 0;color:var(--muted);font-size:14px}.profile-stats{display:flex;gap:25px;margin:12px 0;font-size:13px}.profile-stats b{font-size:16px}.profile-actions{display:flex;gap:8px}.primary-btn{border:0;color:#fff;background:linear-gradient(90deg,var(--ig1),var(--ig2),var(--ig3));padding:9px 18px;border-radius:10px;font-weight:800}.secondary-btn{border:1px solid var(--line);background:#fff;padding:9px 18px;border-radius:10px;font-weight:800}.profile-tabs{display:flex;justify-content:center;gap:50px;padding:17px 0;color:var(--muted);font-size:12px;font-weight:800}.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.modal{position:fixed;inset:0;background:rgba(18,12,24,.52);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.modal-card{width:min(520px,100%);background:#fff;border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line);font-weight:800}.modal-head button{background:none;border:0;font-size:24px}.modal-body{padding:18px}.story-view{min-height:620px;background:linear-gradient(145deg,#4b1ea5,#e72f82,#ff871b);display:flex;flex-direction:column;justify-content:space-between;color:#fff}.story-view-top{display:flex;gap:10px;align-items:center;padding:18px}.story-view-main{display:grid;place-items:center;font-size:150px;flex:1}.story-view-bottom{padding:18px;font-weight:750}.composer{display:flex;flex-direction:column;gap:12px}.composer textarea{min-height:130px;border:1px solid var(--line);border-radius:15px;padding:14px;resize:vertical;outline:none}.composer-actions{display:flex;justify-content:flex-end}.mobile-nav{display:none}.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#19141e;color:#fff;padding:12px 18px;border-radius:999px;font-size:13px;font-weight:750;opacity:0;pointer-events:none;transition:.2s;z-index:70}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:1180px){.app{grid-template-columns:80px minmax(0,760px);max-width:920px}.sidebar{padding-right:4px}.brand{font-size:0;text-align:center;margin-left:0}.brand::first-letter{font-size:28px}.brand small,.nav button span:not(.ico),.sidebar-bottom{display:none}.nav button{justify-content:center;padding:13px}.rightbar{display:none}}@media(max-width:760px){.app{display:block;padding:0 12px}.sidebar{display:none}.main{padding-top:8px}.topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 12px;position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);z-index:20}.topbar .brand{display:block;font-size:24px;margin:0}.stories{padding-bottom:14px}.post{border-radius:16px}.post-media{aspect-ratio:1/1}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:30;justify-content:space-around;padding:10px 7px calc(10px + env(safe-area-inset-bottom))}.mobile-nav button{background:none;border:0;font-size:22px}.profile-header{align-items:flex-start;gap:18px}.profile-large{width:92px;height:92px;font-size:52px}.profile-main h2{font-size:20px}.profile-stats{gap:13px}.profile-tabs{gap:22px}.explore-grid{gap:2px}.tile{border-radius:3px}.page-title{font-size:24px}.modal-card{border-radius:20px}.story-view{min-height:78vh}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand gradient-text">Flygram<small>the insect internet</small></div>
  <nav class="nav">
    <button class="active" data-route="home"><span class="ico">⌂</span><span>Home</span></button>
    <button data-route="search"><span class="ico">⌕</span><span>Search</span></button>
    <button data-route="explore"><span class="ico">✦</span><span>Explore</span></button>
    <button data-route="reels"><span class="ico">▶</span><span>Reels</span></button>
    <button data-action="messages"><span class="ico">✉</span><span>Messages</span></button>
    <button data-action="notifications"><span class="ico">♡</span><span>Notifications</span></button>
    <button data-action="create"><span class="ico">＋</span><span>Create</span></button>
  </nav>
  <div class="sidebar-bottom"><button class="profile-mini" data-profile="you" style="border:0;cursor:pointer"><div class="mini-avatar">🦟</div><div><strong>skeeter.exe</strong><div style="font-size:11px;color:var(--muted)">your profile</div></div></button></div>
</aside>
<main class="main">
  <div class="topbar"><div class="brand gradient-text">Flygram</div><div style="display:flex;gap:12px;font-size:22px"><button data-action="notifications" style="border:0;background:none">♡</button><button data-action="messages" style="border:0;background:none">✉</button></div></div>
  <section class="view active" id="homeView">
    <div class="stories" id="stories"></div>
    <div class="feed" id="feed"></div>
  </section>
  <section class="view" id="exploreView"><div class="page-title">Explore</div><div class="searchbox"><span>⌕</span><input id="exploreSearch" placeholder="Search insects, creators, vibes..."></div><div class="explore-grid" id="exploreGrid"></div></section>
  <section class="view" id="reelsView"><div class="page-title">Reels</div><div class="feed" id="reelsFeed"></div></section>
  <section class="view" id="searchView"><div class="page-title">Search Flygram</div><div class="searchbox"><span>⌕</span><input id="globalSearch" placeholder="Try: mosquito, bee, ladybug..."></div><div id="searchResults"></div></section>
  <section class="view" id="profileView"><div class="profile-page" id="profilePage"></div></section>
</main>
<aside class="rightbar"><div class="right-title"><h3>Suggested for you</h3><button onclick="toast('More recommendations coming soon')">See all</button></div><div class="suggestions" id="suggestions"></div><div style="margin-top:28px;color:#aaa;font-size:11px;line-height:1.7">About · Help · Press · Privacy · Terms<br>© 2026 Flygram</div></aside>
</div>
<nav class="mobile-nav"><button data-route="home">⌂</button><button data-route="explore">⌕</button><button data-action="create">＋</button><button data-route="reels">▶</button><button data-profile="you">🦟</button></nav>
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>
<script>
const insects=[
{id:'you',user:'skeeter.exe',name:'Skeeter',icon:'🦟',type:'Mosquito',bio:'Night shift. Zero apologies. 🩸',followers:'18.4K',following:'412',posts:86,verified:false},
{id:'queenbee',user:'queenbee',name:'Queen Bee',icon:'🐝',type:'Bee',bio:'Running the hive like a startup.',followers:'128K',following:'203',posts:342,verified:true},
{id:'mantis',user:'mantis.official',name:'Mantis',icon:'🦗',type:'Mantis',bio:'Patience is the best weapon.',followers:'91.2K',following:'89',posts:221,verified:true},
{id:'ladybug',user:'lady.bug',name:'Lady Bug',icon:'🐞',type:'Ladybug',bio:'Small bug. Big dreams. 🌿',followers:'67.5K',following:'214',posts:184,verified:true},
{id:'antx',user:'antx',name:'Ant X',icon:'🐜',type:'Ant',bio:'Building the colony, one crumb at a time.',followers:'42.7K',following:'530',posts:512,verified:true},
{id:'dragonfly',user:'flyhigh',name:'Fly High',icon:'🦋',type:'Dragonfly',bio:'Golden hour addict.',followers:'33.1K',following:'177',posts:129,verified:false},
{id:'grass',user:'grasshopper',name:'Grasshopper',icon:'🦗',type:'Grasshopper',bio:'Jump first. Think later.',followers:'29.4K',following:'304',posts:96,verified:false},
{id:'spider',user:'spider.dude',name:'Spider Dude',icon:'🕷️',type:'Spider',bio:'Eight legs. Infinite ideas.',followers:'24.8K',following:'182',posts:202,verified:true},
{id:'skeeterqueen',user:'mosquito.queen',name:'Mosquito Queen',icon:'🦟',type:'Mosquito',bio:'Blood type: expensive.',followers:'54.3K',following:'91',posts:147,verified:false}
];
const posts=[
{user:'bzzy',author:'queenbee',icon:'🐝',scene:'scene-a',text:'Golden hour hits different when you own the whole field.',likes:12400,comments:243,time:'2h',type:'photo'},
{user:'lady.bug',author:'ladybug',icon:'🐞',scene:'scene-b',text:'Morning vibes. Found the perfect leaf after 17 failed landings.',likes:8700,comments:132,time:'1h',type:'photo'},
{user:'mantis.official',author:'mantis',icon:'🦗',scene:'scene-c',text:'POV: someone said the sunset was "just okay".',likes:15200,comments:342,time:'2h',type:'reel'},
{user:'skeeter.exe',author:'you',icon:'🦟',scene:'scene-d',text:'3:17 AM. The humans are asleep. Prime time.',likes:5900,comments:87,time:'34m',type:'photo'},
{user:'antx',author:'antx',icon:'🐜',scene:'scene-a',text:'POV: the kitchen counter just became a 4-hour expedition.',likes:4300,comments:64,time:'3h',type:'photo'},
{user:'flyhigh',author:'dragonfly',icon:'🦋',scene:'scene-b',text:'Blue hour above the pond. No edits needed.',likes:11100,comments:205,time:'5h',type:'photo'}
];
const stories=[{id:'you',user:'Your story',icon:'🦟'},{id:'bzzy',user:'bzzy',icon:'🐝'},{id:'queenbee',user:'queenbee',icon:'🐝'},{id:'mantis',user:'mantis.official',icon:'🦗'},{id:'flyhigh',user:'flyhigh',icon:'🦋'},{id:'ladybug',user:'lady.bug',icon:'🐞'},{id:'antx',user:'antx',icon:'🐜'},{id:'grass',user:'grasshopper',icon:'🦗'},{id:'spider',user:'spider.dude',icon:'🕷️'},{id:'skeeterqueen',user:'mosquito.queen',icon:'🦟'}];
let state=JSON.parse(localStorage.getItem('flygramState')||'{"liked":{},"saved":{},"following":{}}');
const saveState=()=>localStorage.setItem('flygramState',JSON.stringify(state));
const esc=s=>s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function insectAvatar(icon,size='42px'){return `<div class="mini-avatar" style="width:${size};height:${size};font-size:24px">${icon}</div>`}
function storyHTML(s){return `<button class="story-btn" onclick="openStory('${s.id}')"><div class="story-ring"><div class="story-inner">${s.icon}</div></div><div>${esc(s.user)}</div></button>`}
function renderStories(){document.getElementById('stories').innerHTML=stories.map(storyHTML).join('')}
function postHTML(p,i){const liked=!!state.liked[i],saved=!!state.saved[i]; return `<article class="post"><div class="post-head"><div class="post-user" onclick="openProfile('${p.author}')" style="cursor:pointer">${insectAvatar(p.icon,'38px')}<div><strong>${esc(p.user)} ${p.user==='queenbee'||p.user==='lady.bug'||p.user==='mantis.official'||p.user==='antx'||p.user==='spider.dude'?'<span class="verified">●</span>':''}</strong><div class="post-meta">${esc(p.time)} · ${esc(p.type)}</div></div></div><button class="more" onclick="toast('Post menu opened')">•••</button></div><div class="post-media ${p.scene}"><div class="insect">${p.icon}</div></div><div class="post-body"><div class="actions"><button class="like-btn ${liked?'liked':''}" onclick="toggleLike(${i})">${liked?'♥':'♡'}</button><button onclick="toast('Comments opened')">◯</button><button onclick="toast('Post shared')">➤</button><button class="save" onclick="toggleSave(${i})">${saved?'🔖':'▱'}</button></div><div class="post-likes">${formatNum(p.likes+(liked?1:0))} likes</div><div class="caption"><b>${esc(p.user)}</b>${esc(p.text)}</div><div class="comments">View all ${p.comments} comments</div></div></article>`}
function renderFeed(){document.getElementById('feed').innerHTML=posts.map(postHTML).join('')}
function renderReels(){document.getElementById('reelsFeed').innerHTML=posts.filter(p=>p.type==='reel').concat(posts.filter(p=>p.type!=='reel').slice(0,2)).map((p,i)=>postHTML(p,i+20)).join('')}
function formatNum(n){return n>=1000000?(n/1000000).toFixed(1)+'M':n>=1000?(n/1000).toFixed(n%1000===0?0:1)+'K':n}
function toggleLike(i){state.liked[i]=!state.liked[i];saveState();renderFeed()}
function toggleSave(i){state.saved[i]=!state.saved[i];saveState();renderFeed();toast(state.saved[i]?'Saved to your collection':'Removed from saved')}
function openStory(id){const s=stories.find(x=>x.id===id)||stories[1];openModal(`<div class="story-view"><div class="story-view-top">${insectAvatar(s.icon,'42px')}<div><b>${esc(s.user)}</b><div style="opacity:.8;font-size:11px">now</div></div><button style="margin-left:auto;border:0;background:none;color:white;font-size:22px" onclick="closeModal()">×</button></div><div class="story-view-main">${s.icon}</div><div class="story-view-bottom">Today on Flygram · tap × to close</div></div>`)}
function openProfile(userId){const x=insects.find(i=>i.id===userId)||insects.find(i=>i.user===userId)||insects.find(i=>i.id==='you');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('profileView').classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));const following=!!state.following[x.id];document.getElementById('profilePage').innerHTML=`<div class="profile-header"><div class="profile-large">${x.icon}</div><div class="profile-main"><h2>${esc(x.user)} ${x.verified?'<span class="verified">●</span>':''}</h2><div style="font-size:12px;color:var(--muted)">${esc(x.name)} · ${esc(x.type)}</div><p>${esc(x.bio)}</p><div class="profile-stats"><span><b>${x.posts}</b> posts</span><span><b>${x.followers}</b> followers</span><span><b>${x.following}</b> following</span></div><div class="profile-actions"><button class="primary-btn" onclick="toggleFollow('${x.id}',this)">${following?'Following':'Follow'}</button><button class="secondary-btn" onclick="toast('Message composer opened')">Message</button></div></div></div><div class="profile-tabs"><span>▦ POSTS</span><span>▶ REELS</span><span>◉ TAGGED</span></div><div class="profile-grid">${posts.filter(p=>p.author===x.id||p.user===x.user).concat(posts.slice(0,3)).slice(0,9).map((p)=>`<div class="tile ${p.scene}" onclick="toast('Opening post')"><div class="insect">${p.icon}</div></div>`).join('')}</div>`}
function toggleFollow(id,btn){state.following[id]=!state.following[id];saveState();btn.textContent=state.following[id]?'Following':'Follow';toast(state.following[id]?'Following!':'Unfollowed')}
function renderExplore(list=posts){document.getElementById('exploreGrid').innerHTML=list.concat(posts).slice(0,9).map((p,i)=>`<div class="tile ${p.scene}" onclick="openProfile('${p.author}')"><div class="insect">${p.icon}</div><div class="tile-overlay"><span>♥ ${formatNum(p.likes)}</span><span>💬 ${p.comments}</span></div></div>`).join('')}
function renderSuggestions(){document.getElementById('suggestions').innerHTML=insects.filter(x=>x.id!=='you').slice(0,6).map(x=>`<div class="suggestion">${insectAvatar(x.icon,'38px')}<div><strong style="font-size:13px;display:block">${x.user}</strong><span style="font-size:11px;color:var(--muted)">${x.type}</span></div><div class="spacer"></div><button class="follow-btn" onclick="toggleFollow('${x.id}',this)">${state.following[x.id]?'Following':'Follow'}</button></div>`).join('')}
function showSearch(q){const needle=q.trim().toLowerCase();const results=insects.filter(x=>(x.user+x.name+x.type+x.bio).toLowerCase().includes(needle));document.getElementById('searchResults').innerHTML=needle?results.map(x=>`<div class="suggestion" style="padding:12px 0;border-bottom:1px solid var(--line)" onclick="openProfile('${x.id}')">${insectAvatar(x.icon,'48px')}<div><strong>${x.user}</strong><div style="font-size:12px;color:var(--muted)">${x.name} · ${x.type}</div><div style="font-size:12px;color:var(--muted)">${x.followers} followers</div></div></div>`).join(''):'<div style="color:var(--muted);padding:30px 5px">Search for an insect creator, e.g. mosquito, queenbee or lady.bug.</div>'}
function showRoute(route){const map={home:'homeView',explore:'exploreView',reels:'reelsView',search:'searchView'};document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));const el=document.getElementById(map[route]||'homeView');el.classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===route));window.scrollTo({top:0,behavior:'smooth'})}
function openModal(html){document.getElementById('modalCard').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function createPost(){openModal(`<div class="modal-head"><span>Create post</span><button onclick="closeModal()">×</button></div><div class="modal-body"><div class="composer"><textarea id="newPost" placeholder="What's buzzing?"></textarea><div class="composer-actions"><button class="primary-btn" onclick="publishPost()">Share</button></div></div></div>`) }
function publishPost(){const v=document.getElementById('newPost').value.trim();if(!v)return;posts.unshift({user:'skeeter.exe',author:'you',icon:'🦟',scene:'scene-d',text:v,likes:0,comments:0,time:'now',type:'photo'});closeModal();renderFeed();showRoute('home');toast('Posted to Flygram 🦟')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2200)}
document.addEventListener('click',e=>{const r=e.target.closest('[data-route]');if(r)showRoute(r.dataset.route);const p=e.target.closest('[data-profile]');if(p)openProfile(p.dataset.profile);const a=e.target.closest('[data-action]');if(a){if(a.dataset.action==='create')createPost();else toast(a.dataset.action==='messages'?'Messages are coming next 👀':'You are all caught up ❤️')}});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('exploreSearch').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();const list=q?posts.filter(p=>(p.user+p.text).toLowerCase().includes(q)):posts;renderExplore(list)});document.getElementById('globalSearch').addEventListener('input',e=>showSearch(e.target.value));
renderStories();renderFeed();renderReels();renderExplore();renderSuggestions();
</script>
</body>
</html>
